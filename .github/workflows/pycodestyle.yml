name: Python Code Style Check

# Uruchamiaj akcję przy każdym pushu (commicie) oraz pull requeście
on:
  push:
    branches: [ "**" ] # Działa na wszystkich gałęziach
  pull_request:
    branches: [ "**" ]

jobs:
  pycodestyle:
    runs-on: ubuntu-latest

    steps:
      # 1. Pobranie kodu Twojego repozytorium
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Skonfigurowanie środowiska Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15' # Możesz zmienić na wersję, której używasz

      # 3. Instalacja pycodestyle
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle

      # 4. Uruchomienie sprawdzania składni
      - name: Run pycodestyle
        run: |
          # Sprawdza wszystkie pliki .py w repozytorium
          # Możesz dodać flagi np. --max-line-length=120 lub --exclude
          pycodestyle .